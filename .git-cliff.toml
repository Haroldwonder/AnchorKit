# git-cliff configuration for release notes generation
# Uses Conventional Commits to categorize changes.
# Reference: https://git-cliff.org/docs/configuration

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group | upper_first }}
{% for commit in commits %}\
- {{ commit.message | upper_first }}
{% endfor %}
{% endfor %}\
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Sort commits inside sections newest-first
sort_commits = "newest"
# Match both v1.2.3 and 1.2.3 version tags
tag_pattern = "^(v)?\\d+\\.\\d+\\.\\d+$"

commit_parsers = [
  { message = "^feat",     group = "Added" },
  { message = "^fix",      group = "Fixed" },
  { message = "^perf",     group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^change",   group = "Changed" },
  { message = "^docs?",    group = "Changed" },
  { message = "^style",    group = "Changed" },
  { message = "^test",     group = "Changed" },
  { message = "^chore",    group = "Changed" },
  { message = "^build",    group = "Changed" },
  { message = "^ci",       group = "Changed" },
  { message = "^revert",   skip = true },
]
