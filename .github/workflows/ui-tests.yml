name: UI Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react-version: [18, 19]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Install React ${{ matrix.react-version }} for peer dependency testing
        run: npm install --no-save react@^${{ matrix.react-version }}.0.0 react-dom@^${{ matrix.react-version }}.0.0 @types/react@^${{ matrix.react-version }}.x
        working-directory: ui

      - name: Run lint
        run: npm run lint --silent
        working-directory: ui

      - name: Type-check
        run: npm run type-check --silent
        working-directory: ui

      - name: Build
        run: npm run build --silent
        working-directory: ui

      - name: Check bundle size budget
        run: npm run size-limit
        working-directory: ui

      - name: Run tests
        run: npm test -- --ci
        working-directory: ui
