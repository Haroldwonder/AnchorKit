name: Rust CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: MSRV (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check rust-version matches rust-toolchain.toml
        id: msrv
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          pinned=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)
          echo "Cargo.toml rust-version=$msrv, rust-toolchain.toml channel=$pinned"
          if [ "$msrv" != "$pinned" ]; then
            echo "::error::rust-version ($msrv) must equal rust-toolchain.toml channel ($pinned)"
            exit 1
          fi
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      - name: Install exact MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: cargo check (locked) with MSRV
        run: cargo +${{ steps.msrv.outputs.version }} check --locked --all-targets

      - name: cargo check fuzz/ (locked) with MSRV
        working-directory: fuzz
        run: cargo +${{ steps.msrv.outputs.version }} check --locked

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust builds (Cargo.lock + toolchain)
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --verbose --examples

      - name: Check test compilation
        run: cargo check --locked --tests
        # Explicitly verify the test target compiles before running tests.
        # This catches syntax errors in #[cfg(test)] mod blocks (e.g. missing
        # closing braces) as early as possible and surfaces them as a distinct
        # CI step rather than a buried cargo test failure. Closes #884.

      - name: Run tests (host target)
        run: cargo test --locked --verbose

      - name: Run CLI tests
        run: |
          cargo test --locked --bin anchorkit
          cargo run --locked --bin anchorkit -- --help

      - name: Run Windows PowerShell validation scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\validate_all.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\pre_deploy_validate.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\validate_health_score.ps1

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit --deny warnings

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_deterministic_hash, fuzz_domain_validator]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust builds (Cargo.lock + toolchain)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run fuzz target (${{ matrix.target }})
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=60

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore

  proptest-tests:
    name: Proptest Tests (replay window)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust builds (Cargo.lock + toolchain)
        uses: Swatinem/rust-cache@v2

      - name: Check proptest test compilation
        run: cargo check --locked --tests --features proptest-tests

      - name: Run proptest tests
        run: cargo test --locked --features proptest-tests --verbose

      - name: Clippy (proptest-tests)
        run: cargo clippy --locked --features proptest-tests -- -D warnings

  testnet-integration:
    name: Testnet Integration Tests (SEP-6)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust builds (Cargo.lock + toolchain)
        uses: Swatinem/rust-cache@v2

      - name: Check testnet-integration test compilation
        run: cargo check --locked --tests --features testnet-integration

      - name: Run testnet-integration tests
        run: cargo test --locked --features testnet-integration --verbose

      - name: Clippy (testnet-integration)
        run: cargo clippy --locked --features testnet-integration -- -D warnings
