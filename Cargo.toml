[package]
name = "anchorkit"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "anchorkit"
path = "src/bin/anchorkit.rs"

[features]
default = ["std"]
std = ["serde", "serde_json", "toml", "regex", "reqwest"]
wasm = []
mock-only = []
stress-tests = []
proptest-tests = []
testnet-integration = []

[dependencies]
soroban-sdk = "26.1.0"
sha2 = "0.11"
hex = "0.4"
ed25519-dalek = { version = "3", default-features = false }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
toml = { version = "1.1", optional = true }
regex = { version = "1.10", optional = true }
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
soroban-sdk = { version = "26.1.0", features = ["testutils"] }
base64 = "0.22"
ed25519-dalek = "2"
rand = "0.8"
proptest = { version = "1.4", default-features = false, features = ["std"] }
criterion = "0.5"

# Benchmark suite for contract hot paths (issue #738). Uses criterion with a
# custom harness; run with `cargo bench`.
[[bench]]
name = "hot_paths"
harness = false

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

# The `bench` profile otherwise inherits `release` (opt-level = "z"), which is
# tuned for wasm size, not native execution speed. Optimize benches for speed so
# the criterion baselines (issue #738) reflect runtime cost, not code size.
[profile.bench]
opt-level = 3
