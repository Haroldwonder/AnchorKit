[package]
name = "anchorkit"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Soroban-native toolkit for anchoring off-chain attestations to Stellar"
documentation = "https://github.com/Haroldwonder/AnchorKit/blob/main/docs/README.md"
repository = "https://github.com/Haroldwonder/AnchorKit"
keywords = ["stellar", "soroban", "anchor", "attestation", "sep-10"]
categories = ["cryptography", "smart-contracts", "blockchain"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "anchorkit"
path = "src/bin/anchorkit.rs"
required-features = ["std"]

[features]
default = ["std"]
std = ["serde", "serde_json", "toml", "regex", "reqwest", "dep:soroban-client", "dep:tokio"]
wasm = []
mock-only = []
stress-tests = []
proptest-tests = []
testnet-integration = []

[dependencies]
soroban-sdk = "26.1.0"
sha2 = "0.11"
hex = "0.4"
ed25519-dalek = { version = "2", default-features = false }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
toml = { version = "1.1", optional = true }
regex = { version = "1.10", optional = true }
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }
soroban-client = { version = "0.6.0", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
soroban-sdk = { version = "26.1.0", features = ["testutils"] }
base64 = "0.22"
ed25519-dalek = "2"
rand = "0.8"
proptest = { version = "1.4", default-features = false, features = ["std"] }
criterion = "0.5"

# Benchmark suite for contract hot paths (issue #738). Uses criterion with a
# custom harness; run with `cargo bench`.
[[bench]]
name = "hot_paths"
harness = false

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

# The `bench` profile otherwise inherits `release` (opt-level = "z"), which is
# tuned for wasm size, not native execution speed. Optimize benches for speed so
# the criterion baselines (issue #738) reflect runtime cost, not code size.
[profile.bench]
opt-level = 3

# Build settings used by docs.rs when rendering this crate's API documentation.
# `all-features = true` ensures optional modules (SEP-6, SEP-10 JWT, std-only
# CLI helpers) are documented, and the wasm32 + native targets are both built so
# the docs cover the no_std/wasm and native code paths (issue #1538).
[package.metadata.docs.rs]
all-features = true
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg=docsrs"]
